
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;

            background: linear-gradient(
                135deg,
                #141e30,
                #243b55,
                #4776a8
            );

            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            overflow-x: hidden;
        }

        /* Animated Background */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Circles */
        .circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: float 8s infinite ease-in-out;
            pointer-events: none;
        }

        .circle1 {
            width: 180px;
            height: 180px;
            top: 10%;
            left: 10%;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            bottom: 5%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle3 {
            width: 100px;
            height: 100px;
            top: 65%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-40px);
            }
        }

        /* Registration Card */
        .register-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);

            animation: slideUp 1.2s ease;
            transition: transform 0.4s ease;
        }

        .register-box:hover {
            transform: translateY(-5px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: white;
            font-size: 29px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Django Form Styling */
        form p {
            margin-bottom: 18px;
            color: white;
            font-weight: bold;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            color: white;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #243b55;
            font-size: 15px;
            transition: 0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #ffd369;
            box-shadow: 0 0 12px rgba(255, 211, 105, 0.5);
        }

        form ul {
            color: #ffdddd;
            font-size: 13px;
            margin: 8px 0 0 20px;
        }

        /* Register Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                45deg,
                #ff512f,
                #dd2476
            );

            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 5px 20px rgba(221, 36, 118, 0.4);
            transition: all 0.4s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 81, 47, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 30px 20px;
            }

            h2 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Circles -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <!-- Registration Form -->
    <div class="register-box">

        <h2>🎓 Student Registration</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Register →</button>
        </form>

    </div>

</body>
</html>
