
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #141e30,
                #243b55,
                #4776a8
            );

            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: float 8s infinite ease-in-out;
            pointer-events: none;
        }

        .circle1 {
            width: 180px;
            height: 180px;
            top: 10%;
            left: 10%;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            bottom: 5%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle3 {
            width: 100px;
            height: 100px;
            top: 65%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-40px);
            }
        }

        /* Login Box */
        .login-box {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 400px;
            padding: 40px 35px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0,0,0,0.3);

            animation: slideUp 1.2s ease;
            transition: transform 0.4s ease;
        }

        .login-box:hover {
            transform: translateY(-5px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: white;
            font-size: 30px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
            color: white;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;

            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;

            background: rgba(255,255,255,0.9);
            color: #243b55;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        input:focus {
            border-color: #ffd369;
            box-shadow: 0 0 12px rgba(255,211,105,0.5);
            transform: scale(1.02);
        }

        input::placeholder {
            color: #777;
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                45deg,
                #ff512f,
                #dd2476
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: all 0.4s ease;

            box-shadow: 0 5px 20px rgba(221,36,118,0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255,81,47,0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Error Message */
        .error {
            color: #ffdddd;
            background: rgba(255,0,0,0.2);
            border: 1px solid rgba(255,100,100,0.5);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 35px 22px;
            }

            h2 {
                font-size: 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Background Circles -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <!-- Login Form -->
    <div class="login-box">

        <h2>🎓 Student Login</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login →</button>

        </form>

    </div>

</body>
</html>
